name: Tests

# Required on .github's own pull requests by the github-repo-checks ruleset: the scripts'
# tests, shellcheck over every shell script, and actionlint over every workflow.
on:
  issue_comment:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'pyyaml==6.0.2'
      - name: Run the tests
        run: tests/run.sh
      - name: Shellcheck
        run: shellcheck -x bin/* scripts/*.sh tests/*.sh tests/stub/gh
      - name: Actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
